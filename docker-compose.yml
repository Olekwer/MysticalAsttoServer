version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: mystical_astro_postgres
    environment:
      POSTGRES_DB: mystical_astro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mystical_astro_network

  # Redis для кэширования и очередей
  redis:
    image: redis:6-alpine
    container_name: mystical_astro_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mystical_astro_network

  # RabbitMQ для очередей сообщений
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mystical_astro_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - mystical_astro_network

  # MinIO для файлового хранилища
  minio:
    image: minio/minio:latest
    container_name: mystical_astro_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - mystical_astro_network

  # Приложение NestJS
  app:
    build: .
    container_name: mystical_astro_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mystical_astro
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_BUCKET: mystical-astro-content
      NODE_ENV: development
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio
    networks:
      - mystical_astro_network
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  mystical_astro_network:
    driver: bridge 