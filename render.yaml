services:
  - type: web
    name: mystical-astro-api
    env: node
    plan: free
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mystical-astro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://yourdomain.com
      - key: OPENAI_API_KEY
        sync: false # Нужно будет добавить вручную

databases:
  - name: mystical-astro-db
    plan: free
    databaseName: mystical_astro
    user: mystical_user
